<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HTTPS Security Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">⇄</span> TLS-LAB
      <span class="brand-sub">handshake console</span>
    </a>
    <nav class="warn">isolated environment — educational use only</nav>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
  <footer class="foot">
   "HTTPS Security" lab · network {{ domain if domain else 'lab' }}
  </footer>
</body>
</html>
