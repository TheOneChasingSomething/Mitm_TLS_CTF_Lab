# ==============================================================================
# 1. ENVIRONNEMENTS VIRTUELS (QEMU / Packer - Local)
# ==============================================================================
# Utilisé par : make setup-vm-packer-prof-standalone
# Configuration : Port 2222 (forwardé depuis QEMU), utilisateur 'ansible'
; [vm_prof]
; prof_host_vm ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ansible

# ==============================================================================
# 2. CLOUD / VM DISTANTE (CloudStack, AWS, Azure)
# ==============================================================================
# Utilisé par : make cloud_standalone
# Configuration : IP publique/privée de la VM, Port 22 (standard), utilisateur root ou ansible
# NOTE : Décommentez cette section et assurez-vous que [teacher:children] pointe dessus.
[cloud_vm]
# Remplacez <IP> par l'IP de votre Cloud
vm_cloud ansible_host=<IP> ansible_port=22 ansible_user=root ansible_ssh_private_key_file=<PATH>


# ==============================================================================
# 3. MACHINES PHYSIQUES (Salle de TP - Baremetal)
# ==============================================================================
# Utilisé par : make classroom (mode enseignant)
# Configuration : IPs locales du réseau de la classe
[teacher_physical]
pc-prof ansible_host=192.168.1.100 ansible_user=admin ansible_ssh_private_key_file=~/.ssh/id_ed25519

[students_physical]
pc-etu01 ansible_host=192.168.1.101 ansible_user=tp ansible_ssh_private_key_file=~/.ssh/id_ed25519
pc-etu02 ansible_host=192.168.1.102 ansible_user=tp ansible_ssh_private_key_file=~/.ssh/id_ed25519
pc-etu03 ansible_host=192.168.1.103 ansible_user=tp ansible_ssh_private_key_file=~/.ssh/id_ed25519

# ==============================================================================
# 4. GROUPES LOGIQUES MAÎTRES (Utilisés par les Playbooks)
# ==============================================================================
# 
# SCÉNARIO A : VM Locale (QEMU) - Par défaut
# Décommentez 'vm_prof' ci-dessous.
# [teacher:children]
# vm_prof

# SCÉNARIO B : Cloud Standalone (make cloud_standalone)
# Décommentez 'cloud_vm' ci-dessous. Commentez 'vm_prof'.
[teacher:children]
cloud_vm

# vm_prof
# teacher_physical

# SCÉNARIO C : Salle de TP Physique (make classroom)
# Décommentez 'teacher_physical' ci-dessous. Commentez 'vm_prof' et 'cloud_vm'.
# [teacher:children]
# teacher_physical

# Regroupement complet du parc physique pour l'administration globale
[classroom_hosts:children]
teacher_physical
students_physical

# ==============================================================================
# 5. VARIABLES GLOBALES ET PAR GROUPE
# ==============================================================================
; [vm_prof:vars]
; is_virtual=true
; ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

[cloud_vm:vars]
is_virtual=true
ansible_ssh_private_key_file=/home/me/Documents/Perso/Formateur/Oteria/sshKey_VM1
ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'

# Si vous utilisez une clé spécifique pour le cloud, définissez-la ici
#ansible_ssh_private_key_file=~/.ssh/id_ed25519

[classroom_hosts:vars]
is_virtual=false