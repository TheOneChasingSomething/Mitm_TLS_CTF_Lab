# Inventaire de salle de TP.
#   - un hôte 'teacher' : héberge le PORTAIL (site qui reçoit et vérifie les flags).
#   - N hôtes 'students' : hébergent les CIBLES + le client-victime.
# Renseignez les IP réelles ; 'teacher' doit être joignable depuis les postes.

[teacher]
prof ansible_host=192.168.50.1

[students]
poste01 ansible_host=192.168.50.11
poste02 ansible_host=192.168.50.12
poste03 ansible_host=192.168.50.13
# … ajoutez un poste par étudiant/binôme

[all:vars]
ansible_user=lab
ansible_python_interpreter=/usr/bin/python3
