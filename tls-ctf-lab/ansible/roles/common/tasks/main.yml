---
# Installe Docker Engine + le plugin Compose v2 (Debian/Ubuntu).

- name: Nettoyage anciens dépôts et clés Docker corrompus
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/docker.list
    - /etc/apt/sources.list.d/docker.sources
    - /etc/apt/keyrings/docker.gpg

- name: Paquets prérequis (sans mise à jour du cache)
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, rsync]
    update_cache: false
    state: present

- name: Dossier keyrings
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Clé GPG du dépôt Docker (déarmorée)
  ansible.builtin.shell: |
    set -o pipefail
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
    chmod 0644 /etc/apt/keyrings/docker.gpg
  args:
    executable: /bin/bash
    creates: /etc/apt/keyrings/docker.gpg

- name: Dépôt Docker (format deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts['distribution_release'] }}"
    components: stable
    architectures: amd64
    signed_by: /etc/apt/keyrings/docker.gpg
    state: present

- name: Docker Engine + Compose v2
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    update_cache: true
    state: present

- name: Service docker actif
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Répertoire projet
  ansible.builtin.file:
    path: "{{ lab_project_dir }}"
    state: directory
    mode: "0755"