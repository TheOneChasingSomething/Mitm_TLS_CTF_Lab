# 0. S'assurer que les faits système sont chargés (nécessaire pour la distribution)
- name: Collecter les faits si absents
  ansible.builtin.setup:
    gather_subset:
      - min

# 1. Paquets prérequis
- name: Installer les paquets de base
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - rsync
      - git
      - python3
      - python3-pip
    state: present
    update_cache: yes

# 2. Installation de Docker
- name: Créer le dossier des clés GPG Docker
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Télécharger et convertir la clé GPG Docker en format binaire
  ansible.builtin.shell: |
    curl -fsSL https://download.docker.com/linux/ubuntu/gpg | gpg --dearmor -o /etc/apt/keyrings/docker.gpg --yes
    chmod a+r /etc/apt/keyrings/docker.gpg
  args:
    creates: /etc/apt/keyrings/docker.gpg

- name: Ajouter le dépôt Docker (Format deb822)
  ansible.builtin.deb822_repository:
    name: docker
    types: deb
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_distribution_release }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_architecture == 'x86_64' else ansible_architecture }}"
    signed_by: /etc/apt/keyrings/docker.gpg
    state: present

- name: Mettre à jour le cache apt après ajout du dépôt Docker
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 0

- name: Installer Docker Engine et plugins
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present

- name: Activer et démarrer le service Docker
  ansible.builtin.systemd:
    name: docker
    enabled: yes
    state: started