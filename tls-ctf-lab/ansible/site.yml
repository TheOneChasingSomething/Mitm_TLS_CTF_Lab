---
# Déploiement du TP « Sécurité HTTPS » en salle de TP physique.
#   ansible-playbook site.yml -i inventory.ini

- name: Portail central (Machine / VM Prof)
  hosts: portal_hosts
  become: true
  roles:
    - common
    - portal

- name: Cibles vulnérables + client-victime (Postes étudiants physiques)
  hosts: students_physical
  become: true
  roles:
    - common
    - targets