---
# Mode instances centralisées anti-triche.
# Tout tourne sur le serveur prof (VM ou physique). Chaque étudiant reçoit 
# une instance isolée accessible uniquement par SSH confiné.
#
#   ansible-playbook centralized.yml -i inventory.ini

- name: Instances TLS isolées par étudiant
  hosts: teacher
  become: true
  roles:
    - common
    - centralized