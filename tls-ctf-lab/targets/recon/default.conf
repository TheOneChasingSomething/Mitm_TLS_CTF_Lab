# Service de reconnaissance (C0). Écoute sur un port NON STANDARD (9000) afin que
# l'étudiant doive le découvrir au balayage (nmap -p-). Le flag est injecté dans
# le titre HTML par l'entrypoint et se lit via `nmap --script http-title` ou curl.
server {
    listen 9000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    add_header X-Lab-Service "recon" always;   # petite bannière pour -sV
}
