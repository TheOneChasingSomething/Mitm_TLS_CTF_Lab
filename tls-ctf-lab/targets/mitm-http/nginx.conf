# C3 — MITM contre HTTP (clair). AUCUN TLS : le service n'est joignable qu'en
# HTTP clair (port 8453). Le client-victime consulte /c/3/flag-feed en clair ;
# un attaquant en position d'homme-du-milieu (ARP spoofing) renifle le flag tel
# quel. Objectif : maîtriser l'interception passive/active d'un flux non chiffré.
events {}
http {
  server {
    listen 8453;
    server_name bank.tp.lan;

    location = / {
      default_type text/html;
      return 200 '<h1>Banque en ligne (prototype non sécurisé)</h1><a href="/c/3/flag-feed">Consulter mon relevé</a>';
    }
    location / {
      proxy_pass http://portal:5000;
      proxy_set_header Host $host;
    }
  }
}
