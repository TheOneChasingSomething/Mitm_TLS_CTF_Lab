# C6 — Absence de forward secrecy (échange RSA).
#
# Le serveur ne propose QUE des suites à ÉCHANGE DE CLÉS RSA (kRSA) : le secret
# pré-maître est chiffré par le client sous la clé PUBLIQUE RSA du serveur, puis
# transporté dans le ClientKeyExchange. Il n'y a AUCUN éphémère (ECDHE/DHE), donc
# aucune forward secrecy : quiconque a (1) enregistré la session TLS chiffrée et
# (2) obtient plus tard la clé PRIVÉE du serveur peut recalculer le secret
# pré-maître, dériver les clés de session et déchiffrer A POSTERIORI la capture.
#
# Double vulnérabilité assumée :
#   - échange RSA imposé (pas de PFS) ;
#   - clé privée « oubliée » dans un répertoire servi (la fuite du scénario).
#
# ⚠️ Les suites kRSA sont dépréciées ; @SECLEVEL=1 les réautorise sur OpenSSL 3.x.
#    Cible à n'exécuter QUE dans le réseau de laboratoire isolé.
events {}
http {
  server {
    listen 8447 ssl;
    server_name bank.tp.lan;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    # VULNÉRABILITÉ 1 : TLS 1.2 (TLS 1.3 n'a pas d'échange RSA) + suites kRSA
    # uniquement → le trafic est déchiffrable Wireshark avec la clé privée.
    ssl_protocols TLSv1.2;
    ssl_ciphers 'AES128-SHA:@SECLEVEL=1';
    ssl_prefer_server_ciphers on;

    # VULNÉRABILITÉ 2 : la clé privée RSA du serveur est exposée (la « fuite »).
    location /.well-known/backup/ {
      alias /etc/nginx/certs/;   # → /.well-known/backup/server.key
      autoindex on;
    }

    location / {
      proxy_pass http://portal:5000;
      proxy_set_header Host $host;
    }
  }
}
