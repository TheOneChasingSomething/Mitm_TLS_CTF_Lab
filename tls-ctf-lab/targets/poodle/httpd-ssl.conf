# C9 — POODLE (CVE-2014-3566). Apache mod_ssl configuré pour ACCEPTER SSL 3.0
# avec des suites CBC, sans TLS_FALLBACK_SCSV : un attaquant en position MITM
# force le repli vers SSLv3 puis exploite l'oracle de padding CBC pour récupérer
# le cookie de session, octet par octet.
#
# ⚠️ SSLv3 requiert une pile OpenSSL héritée (cf. Dockerfile). Cible à n'exécuter
#    QUE dans le réseau de laboratoire isolé.

Listen 8444
LoadModule ssl_module modules/mod_ssl.so
LoadModule headers_module modules/mod_headers.so
LoadModule proxy_module modules/mod_proxy.so
LoadModule proxy_http_module modules/mod_proxy_http.so

<VirtualHost *:8444>
    ServerName bank.tp.lan
    SSLEngine on
    SSLCertificateFile    /usr/local/apache2/certs/server.crt
    SSLCertificateKeyFile /usr/local/apache2/certs/server.key

    # VULNÉRABILITÉ : SSLv3 activé, suites CBC autorisées.
SSLProtocol SSLv3 TLSv1 TLSv1.1 TLSv1.2    SSLProxyProtocol all
    SSLCipherSuite ALL:!aNULL:!eNULL:+HIGH:+MEDIUM:+SSLv3:AES128-SHA:DES-CBC3-SHA
    SSLHonorCipherOrder off

    # Le flag est porté par un cookie de session — cible de l'oracle POODLE.
    Header always set Set-Cookie "SESSIONFLAG=${FLAG_C9}; Path=/"

    ProxyPass        / http://portal:5000/
    ProxyPassReverse / http://portal:5000/
</VirtualHost>
