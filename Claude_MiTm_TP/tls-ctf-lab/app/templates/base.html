<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TP Sécurité HTTPS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">
      <span class="brand-mark">⇄</span> TLS-LAB
      <span class="brand-sub">console de handshake</span>
    </a>
    <nav class="warn">environnement isolé — usage pédagogique uniquement</nav>
  </header>
  <main class="wrap">
    {% block body %}{% endblock %}
  </main>
  <footer class="foot">
    ANSSI · CFSSI — TP « Sécurité HTTPS » · réseau {{ domain if domain else 'lab' }}
  </footer>
</body>
</html>
