# C8 — SSL Stripping. Le service est joignable EN CLAIR (port 80) et n'émet
# aucun en-tête Strict-Transport-Security. Une page renvoie un lien HTTP en dur
# vers /c/8/flag-feed : un MITM (bettercap/sslstrip) rétrograde la victime et
# lit le flag en clair. La contre-mesure attendue est HSTS (RFC 6797) + preload.
events {}
http {
  # Écoute HTTP en clair — AUCUNE redirection forcée, AUCUN HSTS.
  server {
    listen 80;
    server_name bank.tp.lan;

    location = / {
      default_type text/html;
      # Lien en dur en http:// : c'est lui que sslstrip exploite.
      return 200 '<a href="http://bank.tp.lan/c/8/flag-feed">Consulter mon relevé</a>';
    }
    location / {
      proxy_pass http://portal:5000;
      proxy_set_header Host $host;
    }
  }

  # HTTPS existe mais rien n'oblige la victime à l'emprunter.
  server {
    listen 8443 ssl;
    server_name bank.tp.lan;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    # NOTE : ligne HSTS délibérément absente.
    location / {
      proxy_pass http://portal:5000;
      proxy_set_header Host $host;
    }
  }
}
