# C7 — Logjam (CVE-2015-4000). Apache mod_ssl configuré pour ACCEPTER des suites
# DHE de qualité EXPORT (groupe Diffie-Hellman de 512 bits). Un attaquant en
# position MITM force la rétrogradation vers ce groupe faible ; comme le même
# petit nombre premier est partagé par d'innombrables serveurs, son logarithme
# discret se précalcule une fois pour toutes (Adrian et al., « Imperfect Forward
# Secrecy »). Le secret éphémère devient alors récupérable → déchiffrement de la
# session et lecture du cookie de flag.
#
# ⚠️ Les suites EXPORT requièrent une pile OpenSSL les embarquant encore
#    (openssl 1.0.1f d'Ubuntu 14.04). Cible à n'exécuter QUE dans le lab isolé.

Listen 8448
<IfModule !ssl_module>
  LoadModule ssl_module /usr/lib/apache2/modules/mod_ssl.so
</IfModule>

<VirtualHost *:8448>
    ServerName bank.tp.lan
    SSLEngine on
    SSLCertificateFile    /etc/apache2/certs/server.crt
    SSLCertificateKeyFile /etc/apache2/certs/server.key

    # VULNÉRABILITÉ : suites DHE_EXPORT (DH 512 bits) autorisées.
    SSLProtocol all -SSLv2
    SSLCipherSuite "EXP-EDH-RSA-DES-CBC-SHA:EDH-RSA-DES-CBC3-SHA:EXPORT:HIGH:MEDIUM"
    SSLHonorCipherOrder off

    # Le flag est porté par un cookie de session — récupéré après cassage du DHE.
    Header always set Set-Cookie "SESSIONFLAG=${FLAG_C7}; Path=/"

    ProxyPass        / http://portal:5000/
    ProxyPassReverse / http://portal:5000/
</VirtualHost>
