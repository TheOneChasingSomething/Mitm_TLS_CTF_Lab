# C4 — Certificat auto-signé. Le serveur est correctement chiffré ; la faille
# est côté CLIENT (le client-victime accepte tout certificat). Un MITM peut donc
# présenter son propre certificat auto-signé sans alerter la victime.
events {}
http {
  server {
    listen 8441 ssl;
    server_name bank.tp.lan;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
      proxy_pass http://portal:5000;
      proxy_set_header Host $host;
    }
  }
}
