# C5 — Fuite de clé privée. Le TLS est sain, MAIS la clé privée du serveur a été
# « oubliée » dans un répertoire servi publiquement. Le flag est publié chiffré
# (RSA-OAEP) par le portail ; quiconque récupère la clé peut le déchiffrer.
events {}
http {
  server {
    listen 8442 ssl;
    server_name bank.tp.lan;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Mauvaise pratique intentionnelle : la sauvegarde contient la clé privée RSA
    # du portail — CELLE qui déchiffre le blob RSA-OAEP publié pour ce challenge
    # (montée en lecture seule depuis le volume partagé, cf. docker-compose).
    location /.well-known/backup/ {
      alias /leak/keys/;       # → /.well-known/backup/server.key = clé RSA du portail
      autoindex on;
    }

    location / {
      proxy_pass http://portal:5000;
      proxy_set_header Host $host;
    }
  }
}
