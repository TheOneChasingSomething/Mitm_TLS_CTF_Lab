# C5 — Fuite de clé privée, variante SALLE DE TP.
# La clé privée du portail n'est PAS sur la machine étudiant (le portail est sur
# la machine prof). On proxifie donc TOUT vers le portail central, y compris le
# chemin de « sauvegarde » qui expose la clé (route /.well-known/backup/server.key
# servie par le portail). Comportement fonctionnellement identique au mode local.
events {}
http {
  server {
    listen 8442 ssl;
    server_name bank.tp.lan;
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    location / {
      proxy_pass http://portal:5000;   # 'portal' → IP prof via extra_hosts
      proxy_set_header Host $host;
    }
  }
}
