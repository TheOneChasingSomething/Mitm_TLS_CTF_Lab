---
# Installe Docker Engine + le plugin Compose v2 (Debian/Ubuntu).
# Sur RHEL/rocky, remplacer par le dépôt docker-ce correspondant.

- name: Paquets prérequis
  ansible.builtin.apt:
    name: [ca-certificates, curl, gnupg, rsync]
    update_cache: true
    state: present

- name: Clé GPG du dépôt Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Dépôt Docker
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
    state: present
    filename: docker

- name: Docker Engine + Compose v2
  ansible.builtin.apt:
    name: [docker-ce, docker-ce-cli, containerd.io, docker-compose-plugin]
    update_cache: true
    state: present

- name: Service docker actif
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Répertoire projet
  ansible.builtin.file:
    path: "{{ lab_project_dir }}"
    state: directory
    mode: "0755"
